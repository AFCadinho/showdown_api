<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showdown API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="/docs.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <header class="mb-5">
      <h1 class="display-1 fw-bold lh-1 mb-3">Showdown API</h1>
      <p class="lead text-secondary">API om een Pokemon Showdown battle aan te maken en de eerste battle requests terug te krijgen.</p>

      <div class="row g-3 mt-3" aria-label="API metadata">
        <div class="col-12 col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <div class="font-monospace fw-bold small">API versie</div>
              <p id="api-version" class="card-text text-secondary mb-0">laden...</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <div class="font-monospace fw-bold small">Engine</div>
              <p class="card-text mb-0"><span id="engine-name">pokemon-showdown</span> <span id="engine-version" class="text-secondary"></span></p>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <div class="font-monospace fw-bold small">Base URL</div>
              <p class="card-text text-secondary mb-0"><code id="base-url">laden...</code></p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="mt-4">
      <h2 class="h4 mb-3">Routes</h2>
      <div id="routes" class="row g-3"></div>
    </section>
  </main>
</body>
</html>
